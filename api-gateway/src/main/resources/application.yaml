spring:
  application:
    name: api-gateway

# Note: Spring Cloud Gateway MVC does not support YAML-based route configuration.
# Routes are configured via Java DSL in GatewayConfig.java
#
# The following YAML configuration style only works with reactive Gateway:
# spring.cloud.gateway.routes with predicates and filters
#
# Gateway MVC requires RouterFunction beans for route configuration.

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.servlet.function: DEBUG